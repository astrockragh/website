intro: "Three results that say most of what I do — from merger trees to instrument calibration."
items:
  - title: "Merger trees as graphs"
    summary: "Mangrove encodes halo merger histories as graphs and learns galaxy properties from them — faster and more precisely than semi-analytic models, and interpretably."
    href: /projects/mangrove/
    invert: true
    image: /img/highlights/mangrove.jpg
  - title: "The optical and infrared are connected"
    summary: "Galaxies are routinely modelled as disjoint spectral components. They are not. A data-driven model predicts infrared emission from optical spectra almost losslessly."
    href: /projects/ir-optical/
    image: /img/highlights/ir-optical.jpg
  - title: "Cosmic variance at Cosmic Dawn"
    summary: "The most extreme galaxies JWST finds are shaped by where they sit. Clustering turns that from a nuisance into a measurement."
    href: /projects/measuring-clustering-cosmic-variance/
    invert: true
    image: /img/highlights/clustering.jpg
