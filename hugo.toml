baseURL = "https://astrockragh.github.io/"
languageCode = "en-us"
title = "Christian Kragh Jespersen"
enableRobotsTXT = true

# Hugo drops future-dated content by default, which would silently hide every
# upcoming talk — and the whole point of the Upcoming block on /talks is to
# show them. Without this, adding a talk dated next month makes it disappear.
buildFuture = true
enableGitInfo = false
summaryLength = 30

[params]
  author = "Christian Kragh Jespersen"
  description = "Modelling and measuring the Universe. Schmidt AI in Science / CITA Fellow."
  email = "christian.jespersen@utoronto.ca"

[params.hero]
  eyebrow = "Schmidt AI in Science Fellow · CITA Fellow · University of Toronto"
  headline = "Modelling and measuring the Universe"
  name = "Christian Kragh Jespersen"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "github-dark"

[taxonomies]
  tag = "tags"

