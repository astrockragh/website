{{/* Table of contents, built from the page's own headings via .TableOfContents,
     so it cannot drift when a heading is added, removed or renamed. Placed with
     {{< toc >}} at the point in the markdown where it should appear. */}}
<div class="toc" role="navigation" aria-label="On this page">
  <p class="eyebrow toc__label">On this page</p>
  {{ .Page.TableOfContents }}
</div>
